# Canonical docker compose for the Khmer Online Shop monorepo.
#
#   docker compose up -d --build        # full stack (storefront + admin + api + infra)
#
# Adds optional profiles (see also docker/compose.prod.yml for production):
#   docker compose --profile monitoring up -d
#   docker compose --profile backup up -d
#
# Secrets are loaded from docker/.env (copy docker/.env.example) via
# env_file on every service, so the root full-stack composition and
# docker/compose.prod.yml share one secrets file.

name: champey

services:

  # ---- Infrastructure ---------------------------------------------------

  postgres:
    image: postgres:15
    env_file: docker/.env
    environment:
      POSTGRES_DB: theo_platform
      POSTGRES_USER: theo
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theo"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    env_file: docker/.env
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    env_file: docker/.env
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    env_file: docker/.env
    expose:
      - "7700"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Apps -------------------------------------------------------------

  # One-off init: applies the Prisma schema (db push) and dumps the idempotent
  # demo seed, then exits. Runs before the backend to guarantee tables exist.
  backend-db-init:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: db-init
    env_file: docker/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    env_file: docker/.env
    depends_on:
      postgres:
        condition: service_healthy
      backend-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MEILI_HOST: http://meilisearch:7700
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    env_file: docker/.env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    env_file: docker/.env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Server-to-server URL for the backend socket relay (the browser-facing
      # NEXT_PUBLIC_API_URL build arg is localhost, which is wrong in-container).
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:4000}
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
  redis_data:
  meili_data:
