global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "backend"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:4000"]

  - job_name: "node"
    static_configs:
      - targets: ["champey-node-exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["champey-postgres-exporter:9187"]
