global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "backend"
    metrics_path: /api/metrics
    # Auth via the shared scrape token (Bearer), not a user JWT.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ["backend:4000"]

  - job_name: "node"
    static_configs:
      # Docker Compose service DNS name (compose stack name is not a DNS prefix).
      - targets: ["node-exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
