# Grafana unified-alerting provisioning (format requires title/condition/data,
# NOT the Prometheus rule format this file previously used — it could never
# load and crashed Grafana at startup; fixed 2026-09-09).
#
# Two high-signal rules on the stack-health metrics feed. Infra alerting
# (BackendDown, HighErrorRate, HighLatency, ...) stays in Prometheus
# (docker/prometheus/alerts.yml).
apiVersion: 1

groups:
  - orgId: 1
    name: champey.stack-health
    folder: Champey
    interval: 1m
    rules:
      - uid: champey-stack-unhealthy
        title: Stack unhealthy
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              expr: champey_stack_healthy
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
              expression: A
              refId: C
              type: threshold
        for: 5m
        annotations:
          summary: "Stack unhealthy (auto-repair failed or offline)"
        labels:
          severity: critical
        noDataState: Alerting

      - uid: champey-stack-health-stale
        title: Stack health feed stale
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              expr: time() - champey_last_check_timestamp_seconds
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    type: gt
                    params: [900]
                  operator:
                    type: and
                  query:
                    params: [A]
              expression: A
              refId: C
              type: threshold
        for: 10m
        annotations:
          summary: "No health check has completed in the last 15 minutes (metrics-server down?)"
        labels:
          severity: warning
        noDataState: Alerting
