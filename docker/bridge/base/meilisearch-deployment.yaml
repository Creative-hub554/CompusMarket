apiVersion: apps/v1
kind: Deployment
metadata:
    name: meilisearch
    namespace: champey
    labels:
        com.docker.compose.project: champey
        com.docker.compose.service: meilisearch
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: champey
            com.docker.compose.service: meilisearch
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: champey
                com.docker.compose.service: meilisearch
                com.docker.compose.network.default: "true"
        spec:
            restartPolicy: unless-stopped
            containers:
                - name: meilisearch
