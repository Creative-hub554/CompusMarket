                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
                  ports:
                    - name: meilisearc-7700
                      containerPort: 7700
                  volumeMounts:
                    - name: meili-data
                      mountPath: /meili_data
            volumes:
                - name: meili-data
                  persistentVolumeClaim:
                    claimName: meilisearch-meili-data
