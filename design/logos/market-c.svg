<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Market Bloom — a coral C forming a lotus bowl of gold coins</title>
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3d"/>
      <stop offset="1" stop-color="#f0554a"/>
    </linearGradient>
  </defs>
  <!-- the C: open at the upper right, like a basket -->
  <path d="M96 30 A 46 46 0 1 0 96 98"
        stroke="url(#c1)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- coins/sparks overflowing the bowl -->
  <circle cx="98" cy="24" r="8" fill="#f7c948"/>
  <circle cx="114" cy="44" r="6" fill="#ffd97a"/>
  <circle cx="86" cy="12" r="5" fill="#ff8574"/>
</svg>
