<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Angkor A — gold A with tiered spire crossbars on a dark tile</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232334"/>
      <stop offset="1" stop-color="#181826"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#tile)"/>
  <!-- stupa tip -->
  <path d="M64 14 L72 30 H56 Z" fill="#f7c948"/>
  <!-- A legs -->
  <path d="M64 30 L33 102" stroke="#ffc247" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M64 30 L95 102" stroke="#ffc247" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- tiered crossbars (Angkor towers) -->
  <path d="M46 64 H82" stroke="#ff6b5e" stroke-width="10" stroke-linecap="round"/>
  <path d="M39 84 H89" stroke="#ff6b5e" stroke-width="10" stroke-linecap="round"/>
</svg>
